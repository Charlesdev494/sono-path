# Compilação do app iOS numa máquina macOS do Codemagic.
#
# A pasta ios/ não fica no repositório de propósito: ela é 100% gerada pelo
# Capacitor e depende de CocoaPods, que não roda no Windows. Recriar a cada
# build mantém o repositório limpo e evita commitar um projeto Xcode
# meio-gerado. Os ajustes que o "cap add" apagaria vivem em
# scripts/patch-ios.sh, que roda sempre depois.

workflows:
  ios-appstore:
    name: US360 · iOS · App Store
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      # Este valor é o NOME da chave cadastrada no Codemagic em
      # Teams > Integrations > Developer Portal > Manage keys — não o nome que
      # ela tem do lado da Apple, e é sensível a maiúscula. Nome diferente dá
      # "App Store Connect integration ... does not exist" antes de qualquer
      # etapa rodar.
      app_store_connect: US360

    environment:
      # Tem de acompanhar a versão que gerou o package-lock.json (Node 24 /
      # npm 11). Com Node 22 o npm 10 resolve as dependências de outro jeito e
      # recusa o lock: "Missing: lru-cache@11.5.2 from lock file". O arquivo não
      # está errado — é a versão do npm que discorda.
      node: 24
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.drcharles.sonopath"
        # Precisa bater com o "ID Apple" do app no App Store Connect.
        APP_STORE_APPLE_ID: 6797540534
        # Backend das server functions dentro do app (suporte, IA).
        NATIVE_API_URL: "https://sono-path.vercel.app"
      groups:
        - ios_signing

    # Sem bloco ios_signing: verificado na prática que ele apenas BUSCA um
    # provisioning profile existente e falha com "No matching profiles found"
    # quando não há nenhum — inclusive com a integração correta. Quem cria é a
    # etapa "Preparar assinatura", abaixo.
    #
    # O grupo traz CERTIFICATE_PRIVATE_KEY, a chave RSA usada para montar o
    # .p12 do certificado de distribuição. Ela é cadastrada uma vez nas
    # variáveis de ambiente do app, marcada como secreta.

    triggering:
      # Só a main, e sem disparar em pull request: o repositório é público, e um
      # PR de fork não pode ter acesso às credenciais de publicação.
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:
      - name: Preparar assinatura
        # Cria certificado de distribuição e provisioning profile quando não
        # existem — que é o caso de todo app que nunca foi compilado.
        #
        # --certificate-key é obrigatório: a API da Apple devolve o certificado
        # público, mas o .p12 que assina o binário precisa da chave privada
        # correspondente, e ela nunca sai da Apple. Por isso geramos a nossa e
        # guardamos como segredo — a mesma chave em todos os builds, senão cada
        # execução criaria um certificado novo e estouraria o limite da conta.
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key="@env:CERTIFICATE_PRIVATE_KEY" \
            --create
          keychain add-certificates

      - name: Instalar dependências
        script: npm ci

      - name: Build web em modo nativo (SPA)
        # NATIVE=1 gera dist/client/index.html e aponta as server functions
        # para a Vercel. Sem isso não existe nada para o Capacitor empacotar.
        script: NATIVE=1 NATIVE_API_URL="$NATIVE_API_URL" npm run build

      - name: Conferir que o shell foi gerado
        # Falhar aqui, com mensagem clara, é muito melhor do que descobrir lá
        # na frente com um erro obscuro do Xcode sobre arquivo ausente.
        script: |
          test -f dist/client/index.html || {
            echo "dist/client/index.html não existe — o build SPA não rodou."
            exit 1
          }

      - name: Gerar ícone e splash
        script: |
          npm run assets:nativos
          npx capacitor-assets generate --ios

      - name: Criar projeto iOS
        script: |
          npx cap add ios
          npx cap sync ios

      - name: Ajustar Info.plist
        script: sh scripts/patch-ios.sh

      # Sem etapa de CocoaPods: o Capacitor 8 gera o projeto iOS a partir do
      # ios-spm-template, que usa Swift Package Manager. Não existe Podfile, e o
      # Xcode resolve os pacotes sozinho durante a compilação.

      - name: Número da build
        # A Apple recusa duas builds com o mesmo número. O contador do Codemagic
        # resolve isso sem ninguém ter de lembrar de incrementar nada.
        script: |
          cd ios/App
          agvtool new-version -all "$(($(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID") + 1))"

      - name: Compilar e assinar o .ipa
        # --project, e não --workspace: o template SPM não gera
        # App.xcworkspace, só App.xcodeproj (o .xcworkspace que existe lá dentro
        # é o interno do Xcode, não um workspace de CocoaPods).
        script: |
          xcode-project use-profiles
          xcode-project build-ipa \
            --project "ios/App/App.xcodeproj" \
            --scheme "App"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        # Sobe para o TestFlight, não para a revisão. Você confere no aparelho
        # antes de enviar para a Apple — e a compilação já aparece na tela de
        # versão do App Store Connect.
        submit_to_testflight: false
        submit_to_app_store: false
